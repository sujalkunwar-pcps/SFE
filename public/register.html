<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Virtual Identity — Banana Brain</title>
  <meta name="description" content="Create a new virtual identity to compete and solve mathematical reasoning puzzles.">
  
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>

  <!-- Navigation Header -->
  <header class="header">
    <div class="container navbar">
      <a href="/index.html" class="brand" id="brandLogo">
        <span class="brand-icon">🍌</span>
        <span>Banana<span class="brand-accent">Brain</span></span>
      </a>

      <nav aria-label="Main Navigation">
        <ul class="nav-links">
          <li><a href="/index.html" class="nav-link">Home</a></li>
          <li><a href="/game.html" class="nav-link">Play Arena</a></li>
          <li><a href="/leaderboard.html" class="nav-link">Leaderboard</a></li>
        </ul>
      </nav>

      <div class="nav-auth" id="navAuthContainer">
        <a href="/login.html" class="btn btn-secondary btn-sm">Log In</a>
      </div>
    </div>
  </header>

  <!-- Registration Form Arena -->
  <main class="main-content">
    <div class="container auth-wrapper">
      <div class="card card-glass auth-card" style="max-width: 480px;">
        
        <div class="auth-header">
          <div style="font-size: 2.5rem; margin-bottom: var(--space-2);">🚀</div>
          <h1>Create Virtual Identity</h1>
          <p>Join Banana Brain to establish your track record and solve visual equations.</p>
        </div>

        <form id="registerForm" novalidate>
          <div class="form-group">
            <label for="username" class="form-label">Username (Unique Identifier)</label>
            <input 
              type="text" 
              id="username" 
              name="username" 
              class="form-control" 
              placeholder="e.g. brain_monkey" 
              required 
              autocomplete="username"
            />
          </div>

          <div class="form-group">
            <label for="displayName" class="form-label">Display Name (Public Screen Name)</label>
            <input 
              type="text" 
              id="displayName" 
              name="displayName" 
              class="form-control" 
              placeholder="e.g. Professor Banana" 
            />
          </div>

          <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="form-control" 
              placeholder="e.g. student@bedfordshire.ac.uk" 
              required 
              autocomplete="email"
            />
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password (Min 8 Characters)</label>
            <div class="password-wrapper">
              <input 
                type="password" 
                id="password" 
                name="password" 
                class="form-control" 
                placeholder="Choose a strong password" 
                required 
                autocomplete="new-password"
              />
              <button type="button" class="password-toggle" aria-label="Show password">Show</button>
            </div>
          </div>

          <div class="form-group">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <div class="password-wrapper">
              <input 
                type="password" 
                id="confirmPassword" 
                name="confirmPassword" 
                class="form-control" 
                placeholder="Re-enter your password" 
                required 
                autocomplete="new-password"
              />
              <button type="button" class="password-toggle" aria-label="Show password">Show</button>
            </div>
          </div>

          <!-- Avatar Color Selection -->
          <div class="form-group">
            <label class="form-label">Choose Avatar Identity Color</label>
            <div style="display: flex; gap: var(--space-3); margin-top: var(--space-1);">
              <label style="cursor: pointer;">
                <input type="radio" name="avatarColor" value="#F59E0B" checked style="display:none;" />
                <span class="avatar" style="background: #F59E0B; border: 2px solid #FFF;">🟡</span>
              </label>
              <label style="cursor: pointer;">
                <input type="radio" name="avatarColor" value="#3B82F6" style="display:none;" />
                <span class="avatar" style="background: #3B82F6;">🔵</span>
              </label>
              <label style="cursor: pointer;">
                <input type="radio" name="avatarColor" value="#10B981" style="display:none;" />
                <span class="avatar" style="background: #10B981;">🟢</span>
              </label>
              <label style="cursor: pointer;">
                <input type="radio" name="avatarColor" value="#8B5CF6" style="display:none;" />
                <span class="avatar" style="background: #8B5CF6;">🟣</span>
              </label>
              <label style="cursor: pointer;">
                <input type="radio" name="avatarColor" value="#EC4899" style="display:none;" />
                <span class="avatar" style="background: #EC4899;">🌸</span>
              </label>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-3);" id="registerSubmitBtn">
            Create Virtual Identity
          </button>
        </form>

        <div class="auth-footer">
          Already registered? 
          <a href="/login.html">Log in here</a>
        </div>

      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div>Banana Brain &copy; University of Bedfordshire</div>
      <ul class="footer-links">
        <li><a href="/index.html">Home</a></li>
        <li><a href="/login.html">Log In</a></li>
      </ul>
    </div>
  </footer>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
